name: NIFTY Paper Trading Robot

on:
  schedule:
    - cron: "*/5 4-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nifty-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download robot code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install yfinance pandas

      - name: Run paper trading robot
        run: python nifty_bot.py

      - name: Save trading history
        run: |
          git config user.name "NIFTY Paper Bot"
          git config user.email "bot@example.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push
          
